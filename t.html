<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Swap on Hover</title>
    <style>
        .image-container {
            position: relative;
            width: 300px; /* Set the desired width */
            height: 200px; /* Set the desired height */
            overflow: hidden;
        }
        .image-container img {
            width: 100%;
            height: auto;
            transition: opacity 0.3s ease;
        }
        .image-container .image-hover {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .image-container:hover .image-hover {
            opacity: 1; /* Show the hover image */
        }
        .image-container:hover img:not(.image-hover) {
            opacity: 0; /* Hide the original image */
        }
    </style>


</head>
<body>
    <div id="brandCarousel" class="carousel slide" data-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://via.placeholder.com/150?text=Brand+1" class="d-block mx-auto" alt="Brand 1">
            </div>
            <div class="carousel-item">
                <img src="https://via.placeholder.com/150?text=Brand+2" class="d-block mx-auto" alt="Brand 2">
            </div>
            <div class="carousel-item">
                <img src="https://via.placeholder.com/150?text=Brand+3" class="d-block mx-auto" alt="Brand 3">
            </div>
        </div>
        <a class="carousel-control-prev" href="#brandCarousel" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#brandCarousel" role="button" data-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Next</span>
        </a>
    </div>
    
<div class="bg-image hover-zoom">
  <img src="https://mdbcdn.b-cdn.net/img/new/standard/city/053.webp" class="w-100" />
</div>
<div class="image-container">
    <img src="https://www.maximawatches.com/cdn/shop/files/V194MSSI71233.jpg?v=1727073219" alt="Image 1" class="image-default">
    <img src="https://www.maximawatches.com/cdn/shop/files/Artboard_7_360x.png?v=1727073240" alt="Image 2" class="image-hover">
</div>

</body>
</html>
